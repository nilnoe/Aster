name: CI-Swift

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bridge/**"
      - "Package.swift"
      - ".github/workflows/ci-swift.yml"
  pull_request:
    paths:
      - "app/**"
      - "bridge/**"
      - "Package.swift"

jobs:
  swift:
    name: Swift Gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Format
        run: swift-format lint --recursive Sources Tests
      - name: Test
        run: swift test
