name: CI-Swift

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bridge/**"
      - "Package.swift"
      - ".github/workflows/ci-swift.yml"
  pull_request:
    paths:
      - "app/**"
      - "bridge/**"
      - "Package.swift"

jobs:
  swift:
    name: Swift Gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install swift-format
        run: brew install swift-format
      - name: Build Rust staticlib + generate bindings
        run: ./bridge/build.sh
      - name: Format (hand-written Swift; Sources 为生成绑定，工具产物不 lint)
        run: swift-format lint --recursive bridge/Tests app/Tests
      - name: Test bridge
        run: swift test
        working-directory: bridge
      - name: Test app
        run: swift test
        working-directory: app
