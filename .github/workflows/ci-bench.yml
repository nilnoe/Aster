name: CI-Bench

# T-033（ADR-021 v1.1）：基准回归告警——cargo bench（quick）后与仓库内提交的
# 基线对比，回归超阈值即失败。告警级门禁：阈值 / 10µs 下限吸收跨机器噪声，
# 全量测量仍以本地 release 为准（ADR-021 决策 3 / 4）。

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bench-baseline/**"
      - "scripts/bench-regression.py"
      - ".github/workflows/ci-bench.yml"
  pull_request:
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "bench-baseline/**"
      - "scripts/bench-regression.py"
  workflow_dispatch:

jobs:
  bench-regression:
    name: Benchmark Regression Alert
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmarks (quick)
        # T-048：显式固定 target 目录——cargo 在 CI 上会把结果落到 workspace 根
        # （Aster/target），导致对比脚本找不到 core/target/criterion。
        # CARGO_TARGET_DIR=target（相对 core/）保证结果确定落在 core/target/。
        run: cd core && CARGO_TARGET_DIR=target cargo bench --bench bench_editor --bench bench_pipeline -- --quick
      - name: Compare against committed baseline
        # T-048/T-049：median 对比 + 阈值 200%、下限 100µs（ADR-021 v1.3）——
        # 共享 runner 的 quick 模式实测噪声 +26%~+120%（偶发越过 100%），CI 只做
        # 「3 倍级恶化」粗告警，精确回归以本地 release 全量测量为准（ADR-021 决策 4）。
        run: python3 scripts/bench-regression.py --baseline-dir bench-baseline --threshold 2.0 --criterion-root core/target/criterion
