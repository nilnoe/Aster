name: CI-Rust

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  rust:
    name: Rust Core Gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
