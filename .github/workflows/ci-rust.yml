name: CI-Rust

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  rust:
    name: Rust Core Gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Fuzz (property extended cases)
        # T-033（ADR-022 v1.1）：fuzz 语义 = 扩展属性空间；默认 256 例 → 3000 例
        # 的 property 专项运行，覆盖 emoji / CJK / 换行 / 组合字符输入；
        # T-035 拆分后基础与 fuzz 两个二进制分别跑。
        run: PROPTEST_CASES=3000 cargo test --test property --test property_fuzz
      - name: Scale Budget
        run: |
          fail=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f" | tr -d ' ')
            if [ "$lines" -gt 300 ]; then
              echo "OVER 300 LINES: $f ($lines)"
              fail=1
            fi
          done < <(find core -name '*.rs' -not -path '*/target/*')
          total=$(find core/src -name '*.rs' -exec cat {} + | wc -l | tr -d ' ')
          echo "core/src total lines: $total"
          if [ "$total" -gt 20000 ]; then
            echo "OVER CORE BUDGET: $total"
            fail=1
          fi
          exit $fail
