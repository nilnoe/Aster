name: CI-Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ADR.md"
      - "AGENTS.md"
      - "WORKFLOW.md"
      - "README.md"
      - ".github/workflows/ci-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "ADR.md"
      - "AGENTS.md"
      - "WORKFLOW.md"
      - "README.md"
      - ".github/workflows/ci-docs.yml"

jobs:
  docs:
    name: Docs Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # T-039：审计 hash 完整性检查需要完整历史（默认浅克隆只有最新提交）。
          fetch-depth: 0
      - name: ADR index completeness (宪法 Rule 15)
        run: |
          fail=0
          # 每个 ADR 文件必须出现在索引中
          while IFS= read -r f; do
            name=$(basename "$f")
            if ! grep -qF "$name" docs/adr/README.md; then
              echo "MISSING FROM ADR INDEX: $name"
              fail=1
            fi
          done < <(find docs/adr -maxdepth 1 -name 'ADR-*.md' | sort)
          # 索引中每条 ADR 链接必须指向真实文件
          while IFS= read -r link; do
            if [ ! -f "docs/adr/$link" ]; then
              echo "BROKEN ADR INDEX LINK: $link"
              fail=1
            fi
          done < <(grep -oE '\]\(ADR-[^)]+\.md\)' docs/adr/README.md | sed -E 's/^\]\(//; s/\)$//' | sort -u)
          exit $fail
      - name: Audit log integrity (宪法 Rule 15 扩展，T-039)
        # I-007：审计留痕此前靠人工回填，无机械门禁。两条规则：
        # 1) 「本切片」只允许出现在最末（当前切片）一行——未回填的审计行不得累积；
        # 2) 审计表内所有 commit 引用必须真实存在于 git 历史。
        run: |
          fail=0
          # 只数 Commit 列（`| 本切片 |`）；正文措辞（如"拆分前置在本切片完成"）
          # 不计入。
          unbackfilled=$(grep -cE '\| 本切片 \|' docs/audits.md || true)
          if [ "$unbackfilled" -gt 1 ]; then
            echo "UNBACKFILLED AUDIT ROWS: $unbackfilled 行（只允许当前切片一行）"
            fail=1
          fi
          while IFS= read -r hash; do
            if ! git cat-file -e "$hash^{commit}" 2>/dev/null; then
              echo "UNKNOWN COMMIT IN AUDITS: $hash"
              fail=1
            fi
          done < <(grep -oE '\b[0-9a-f]{7,40}\b' docs/audits.md | sort -u)
          exit $fail
      - name: FFI ledger integrity (宪法 Rule 15，ADR-024)
        # 手抄 FFI 计数已知会漂移（ADR-013 头部 vs 索引，ADR-024 提议）；
        # bridge.rs ffi mod 是唯一事实来源，脚本统计与 ADR-024 数字必须一致。
        run: |
          count=$(python3 scripts/ffi-ledger.py)
          if ! grep -qF "当前 FFI 面：${count} 项" docs/adr/ADR-024-ffi-ledger.md; then
            echo "FFI 总账漂移：bridge.rs 实测 ${count} 项，ADR-024 未同步"
            exit 1
          fi
